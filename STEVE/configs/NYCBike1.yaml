## global
seed: 31
device: cuda:3
mode: train
best_path: /home/zhangwt/remote/StableST/experiments/NYCBike1/20240731-060957/best_model.pth
debug: False  

## data 
data_dir: data
dataset: NYCBike1  
input_length: 19 # 4+5*3
len_closeness: 4
len_period: 15
len_trend: 0
batch_size: 64
test_batch_size: 64
graph_file: data/NYCBike1/adj_mx.npz # 128 x 128
num_nodes: 128

## model 
d_input: 2                  # means inflow and outflow
d_output: 2                 # means inflow and outflow
d_model: 64
dropout: 0.1
percent: 0.1                # augumentation percentage
shm_temp: 0.5               # temperature for loss of spatial heterogeneity modeling
nmb_prototype: 50           # number of cluster
yita: 0.5                   # balance for inflow loss and outflow loss, $yita * inflow + (1 - yita) * outflow$
layers: 3
K : 64
bank_gamma : 0.7
kw : 2
mi_w : 2

## train
epochs: 2
lr_init: 0.001
lr_mode: only

early_stop: True
early_stop_patience: 50
grad_norm: True
max_grad_norm: 5
use_dwa: True         # whether to use dwa for loss balance
temp: 4               # tempurature parameter in dwa, a larger T means more similer weights
MMI: False
lr_patience: 20

use_RevIN: False

## latent-confounder structural regularization
confounder_dep_mode: none      # none | gci | scd | both
confounder_extractor: token_attention
confounder_dim: 8
confounder_num_heads: 4
confounder_attention_dropout: 0.0
confounder_graph_embed_dim: 16
confounder_variational: True
confounder_kl_weight: 0.0001
confounder_dep_warmup_epochs: 5
confounder_dep_ramp_epochs: 10
confounder_projection_ridge: 0.001
confounder_dep_detach_target: True
gci_weight: 0.001
gci_graph_align_weight: 0.1
gci_graph_hops: 1
gci_symmetrize_adj: True
gci_add_self_loops: True
scd_weight: 0.001
dep_eps: 1.0e-6
confounder_injection: none
